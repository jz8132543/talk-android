# .github/workflows/build-release.yml
name: Build Custom Nextcloud Talk Release

on:
# manual trigger enabled
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # 每周日自动运行
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Repository to build (leave empty for current repository)'
        required: false
        default: ''
      ref:
        description: 'Git branch or tag to build'
        required: false
        default: 'master'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.upstream_repo || github.repository }}
          ref: ${{ inputs.ref || 'master' }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Build Tools
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: 35.0.0

      - name: Patch Video Resolution Limits
        run: |
          echo "Patching resolution and FPS limits..."
          FILE="app/src/main/java/com/nextcloud/talk/activities/CallActivity.kt"
          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE not found!"
            exit 1
          fi

          # 替换帧率至 180 FPS
          sed -i -E 's/(private const val FRAME_RATE(: [a-zA-Z0-9_]+)? =).*/\1 180/' "$FILE"
          # 替换横屏 16:9 比例至 8K (7680x4320)
          sed -i -E 's/(private const val WIDTH_16_TO_9_RATIO(: [a-zA-Z0-9_]+)? =).*/\1 7680/' "$FILE"
          sed -i -E 's/(private const val HEIGHT_16_TO_9_RATIO(: [a-zA-Z0-9_]+)? =).*/\1 4320/' "$FILE"
          # 替换竖屏 4:3 比例至 8K 4:3 等比高分辨率 (5760x4320)
          sed -i -E 's/(private const val WIDTH_4_TO_3_RATIO(: [a-zA-Z0-9_]+)? =).*/\1 5760/' "$FILE"
          sed -i -E 's/(private const val HEIGHT_4_TO_3_RATIO(: [a-zA-Z0-9_]+)? =).*/\1 4320/' "$FILE"

          echo "=== Verifying patched values in $FILE ==="
          grep -E "FRAME_RATE|WIDTH_16_TO_9_RATIO|HEIGHT_16_TO_9_RATIO|WIDTH_4_TO_3_RATIO|HEIGHT_4_TO_3_RATIO" "$FILE"

          grep -q "180" "$FILE" || { echo "Failed to patch FRAME_RATE"; exit 1; }
          grep -q "7680" "$FILE" || { echo "Failed to patch WIDTH_16_TO_9_RATIO"; exit 1; }
          grep -q "5760" "$FILE" || { echo "Failed to patch WIDTH_4_TO_3_RATIO"; exit 1; }

      - name: Build Release APK
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew --no-daemon assembleGenericRelease

      - name: Check Keystore Availability
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Keystore secrets are not configured. The APK will be uploaded unsigned."
          fi

      - name: Sign Release APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/generic/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload Signed Release APK Artifact
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nextcloud-Talk-Custom-8K-Release-Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 7

      - name: Create Release (Signed APK)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ci-${{ github.sha }}"
          name: "CI Build ${{ github.sha }}"
          prerelease: true
          body: |
            自动生成的 CI Release，包含已签名的 8K APK。
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unsigned Release APK Artifact
        if: steps.check_keystore.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nextcloud-Talk-Custom-8K-Release-Unsigned
          path: app/build/outputs/apk/generic/release/*.apk
          retention-days: 7

      - name: Create Release (Unsigned APK)
        if: steps.check_keystore.outputs.has_keystore != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ci-${{ github.sha }}"
          name: "CI Build ${{ github.sha }} (unsigned)"
          prerelease: true
          body: |
            自动生成的 CI Release（未签名），包含 8K APK。
          files: app/build/outputs/apk/generic/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

